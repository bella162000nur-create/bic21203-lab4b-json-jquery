
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Display Book Information</title>
</head>
<body>
    <h1>Book Information</h1>

    <div id="bookDetails">
        <p>Loading book information...</p>
    </div>

    <script>
        fetch("books.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Unable to load the JSON file.");
                }
                return response.json();
            })
            .then(data => {
                const bookDetails = document.getElementById("bookDetails");
                bookDetails.textContent = "";

                // (a) Display the title of the first book
                const firstTitle = document.createElement("p");
                firstTitle.textContent = "First Book Title: " + data.books[0].title;
                bookDetails.appendChild(firstTitle);

                // (b) Display the author of the second book
                const secondAuthor = document.createElement("p");
                secondAuthor.textContent = "Second Book Author: " + data.books[1].author;
                bookDetails.appendChild(secondAuthor);

                // (c) Display genres of both books
                data.books.forEach(book => {
                    const genreInfo = document.createElement("p");
                    genreInfo.textContent =
                        book.title + " — " + book.genres.join(", ");

                    bookDetails.appendChild(genreInfo);
                });
            })
            .catch(error => {
                document.getElementById("bookDetails").textContent =
                    "Error: Unable to display book information. Please check books.json.";
                console.error(error);
            });
    </script>
</body>
</html>
